name: Build Jetson bootc image

# Builds the Jetson Orin RHEL Image Mode (bootc) container image natively on
# ARM64, saves it with `podman save`, and publishes it as a GitHub Release
# whose tag is the build date.
#
# Which Containerfile gets built: the ContainerFile-* symlink at the repo root
# (currently ./ContainerFile-Jetson-1.3.0-docker-compose -> managed-device-artifacts/...).
# Repoint that symlink to switch what CI builds.
#
# Required repository secrets are documented in .github/SECRETS.md

on:
  workflow_dispatch:
    inputs:
      containerfile:
        description: "Containerfile path (blank = follow the ContainerFile-* symlink at the repo root)"
        required: false
        default: ""
      image_name:
        description: "Override the derived image name, e.g. jetson-flightctl-1.3.0-docker-compose"
        required: false
        default: ""
      publish_release:
        description: "Publish a GitHub Release with the saved image tarball"
        type: boolean
        default: true
      push_to_ghcr:
        description: "Also push the image to ghcr.io (recommended: a release asset must be split at 2 GB)"
        type: boolean
        default: false
      squash:
        description: "Squash all new layers into one (keeps deleted entitlement certs out of the published tarball)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "ContainerFile-*"
      - "managed-device-artifacts/ContainerFile-*"
      # Deliberately NOT triggered by edits to this workflow file: iterating on
      # CI would otherwise kick off a multi-hour build and cut a release on
      # every commit. Use workflow_dispatch to test changes here.

permissions:
  contents: write   # create the release
  packages: write   # push the build cache (and optionally the image) to ghcr.io

concurrency:
  group: build-jetson-image
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Confirm every secret the build needs is actually configured, before we burn
  # an hour of ARM runner time discovering it the hard way.
  # ---------------------------------------------------------------------------
  preflight:
    name: Check required repository secrets
    runs-on: ubuntu-latest
    steps:
      - name: Verify secrets are present
        env:
          REDHAT_REGISTRY_USERNAME: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          REDHAT_REGISTRY_PASSWORD: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}
          RH_USERNAME: ${{ secrets.RH_USERNAME }}
          RH_PASSWD: ${{ secrets.RH_PASSWD }}
          DEVICE_USERNAME: ${{ vars.DEVICE_USERNAME || 'redhat' }}
          DEVICE_USER_PASSWD: ${{ vars.DEVICE_USER_PASSWD || 'redhat' }}
        run: |
          set -uo pipefail
          # The device login is deliberately PUBLIC so workshop attendees can log
          # in to a freshly flashed device, so it lives in repository *variables*
          # rather than secrets and is not checked for here.
          missing=()
          for name in REDHAT_REGISTRY_USERNAME REDHAT_REGISTRY_PASSWORD \
                      RH_USERNAME RH_PASSWD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done

          {
            echo "### Required secrets"
            echo
            for name in REDHAT_REGISTRY_USERNAME REDHAT_REGISTRY_PASSWORD \
                        RH_USERNAME RH_PASSWD; do
              if [ -n "${!name:-}" ]; then echo "- \`$name\` — set"; else echo "- \`$name\` — **MISSING**"; fi
            done
            echo
            echo "### Device login (public, baked into the image)"
            echo
            echo "- username \`${DEVICE_USERNAME}\` / password \`${DEVICE_USER_PASSWD}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. See .github/SECRETS.md"
            exit 1
          fi
          echo "All required secrets are configured."

      # Catch the unpublishable combination here rather than after a multi-hour
      # build: without --squash the archive retains recoverable entitlement
      # certificates, and a release on a non-private repository is public.
      - name: Refuse an unpublishable release up front
        if: github.event_name == 'workflow_dispatch' && inputs.squash == false && inputs.publish_release
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -uo pipefail
          if [ "${REPO_VISIBILITY}" != "private" ]; then
            echo "::error::squash=false with publish_release=true on a ${REPO_VISIBILITY} repository would publish Red Hat entitlement certificates."
            echo "::error::Set publish_release=false and use push_to_ghcr with a private package instead."
            exit 1
          fi

  build:
    name: Build on native ARM64
    needs: preflight
    # Native aarch64 hosted runner. Free for public repositories.
    # QEMU emulation is NOT used: nvidia-jetpack-* and subscription-manager
    # under binfmt emulation is both unreliable and ~10x slower.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      image_name: ${{ steps.resolve.outputs.image_name }}
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      date_tag: ${{ steps.resolve.outputs.date_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk space
        run: |
          set -uo pipefail
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift 2>/dev/null || true
          sudo apt-get clean || true
          echo "After:"; df -h /

      # Do NOT apt-install podman here. ubuntu-24.04-arm already ships podman,
      # buildah, skopeo, zstd, jq and gh. Installing the Ubuntu podman package
      # on top leaves two podman versions on the box plus a /dev/shm/libpod_lock
      # segment sized for the other one, and every later podman call dies with:
      #   failed to open 2048 locks in /libpod_lock: numerical result out of range
      - name: Check container tooling
        run: |
          set -euo pipefail
          # Clear any stale SHM lock segment before the first podman call.
          sudo rm -f /dev/shm/libpod_lock /dev/shm/libpod_rootless_lock_* || true
          for tool in podman skopeo zstd jq gh; do
            printf '%-8s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done
          podman version
          # Rootful podman: the bootc base image layers are large and root
          # storage avoids fuse-overlayfs overhead on the hosted runner.
          sudo podman info --format 'driver={{.Store.GraphDriverName}} root={{.Store.GraphRoot}}'

      - name: Resolve Containerfile and derive image name
        id: resolve
        env:
          INPUT_CONTAINERFILE: ${{ inputs.containerfile }}
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_CONTAINERFILE}" ]; then
            link="${INPUT_CONTAINERFILE}"
          else
            # Follow the ContainerFile-* symlink at the repo root.
            mapfile -t links < <(find . -maxdepth 1 -type l -iname 'Containerfile-*' -printf '%P\n' | sort)
            if [ "${#links[@]}" -eq 0 ]; then
              echo "::error::No ContainerFile-* symlink found at the repo root. Create one (e.g. ln -s ./managed-device-artifacts/ContainerFile-Jetson-1.3.0-docker-compose ContainerFile-Jetson-1.3.0-docker-compose) or pass the containerfile input."
              exit 1
            fi
            if [ "${#links[@]}" -gt 1 ]; then
              echo "::error::Multiple ContainerFile-* symlinks at the repo root (${links[*]}). Keep exactly one, or pass the containerfile input."
              exit 1
            fi
            link="${links[0]}"
          fi

          target="$(readlink -f "$link")"
          [ -f "$target" ] || { echo "::error::$link does not resolve to a file"; exit 1; }

          # ContainerFile-Jetson-1.3.0-docker-compose
          #   -> platform "jetson", version "1.3.0", variant "docker-compose"
          #   -> jetson-flightctl-1.3.0-docker-compose
          base="$(basename "$link")"
          rest="$(echo "${base}" | sed -E 's/^[Cc]ontainer[Ff]ile-//' | tr '[:upper:]' '[:lower:]')"
          platform="${rest%%-*}"
          remainder="${rest#*-}"
          flightctl_version="${remainder%%-*}"

          if [ -n "${INPUT_IMAGE_NAME}" ]; then
            image_name="${INPUT_IMAGE_NAME}"
          else
            image_name="${platform}-flightctl-${remainder}"
          fi

          date_tag="$(date -u +%Y-%m-%d)"
          image_ref="localhost/${image_name}:${date_tag}"

          {
            echo "containerfile=${target}"
            echo "containerfile_link=${link}"
            echo "image_name=${image_name}"
            echo "image_ref=${image_ref}"
            echo "date_tag=${date_tag}"
            echo "flightctl_version=${flightctl_version}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Build target"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Symlink | \`${link}\` |"
            echo "| Containerfile | \`${target#$PWD/}\` |"
            echo "| Image | \`${image_ref}\` |"
            echo "| Flight Control version (from filename) | \`${flightctl_version}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to registry.redhat.io and ghcr.io
        env:
          REDHAT_REGISTRY_USERNAME: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          REDHAT_REGISTRY_PASSWORD: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REDHAT_REGISTRY_PASSWORD" \
            | sudo podman login registry.redhat.io \
                --username "$REDHAT_REGISTRY_USERNAME" --password-stdin
          printf '%s' "$GHCR_TOKEN" \
            | sudo podman login ghcr.io \
                --username "${{ github.actor }}" --password-stdin

      # The layer cache is a second, independent disclosure path that --squash
      # does nothing about: --cache-to exports the INTERMEDIATE layers, including
      # the one created right after `subscription-manager register`, with the
      # entitlement certificates fully intact. If that package is publicly
      # readable, those certs are public no matter how the final image is built.
      - name: Assert the build cache is not publicly readable
        run: |
          # NOTE: the runner invokes every `run:` block as `bash -e`, which a
          # `set -uo pipefail` line does NOT undo. Both curls below fail by
          # design when the package is private or absent (the ghcr.io token
          # endpoint answers 403), so each one must be guarded or -e aborts the
          # step and reports a false positive.
          set -uo pipefail
          repo_lc="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          pkg="${repo_lc}/buildcache"

          # Anonymous pull attempt. Succeeding means anyone on the internet can
          # read the cached layers.
          body="$(curl -fsSL "https://ghcr.io/token?service=ghcr.io&scope=repository:${pkg}:pull" 2>/dev/null || true)"
          tok="$(printf '%s' "$body" | jq -r '.token // empty' 2>/dev/null || true)"

          public=no
          if [ -n "$tok" ]; then
            if curl -fsS -o /dev/null -H "Authorization: Bearer ${tok}" \
                 "https://ghcr.io/v2/${pkg}/tags/list" 2>/dev/null; then
              public=yes
            fi
          fi

          if [ "$public" = yes ]; then
            echo "::error::The build cache package ghcr.io/${pkg} is PUBLICLY READABLE."
            echo "::error::It contains pre-cleanup layers holding Red Hat entitlement certificates. Set the package to private at https://github.com/users/${{ github.repository_owner }}/packages/container/package/buildcache/settings and rotate the entitlement by re-registering the system."
            exit 1
          fi
          echo "Build cache is not anonymously readable (private, or not created yet)."

      - name: Stage build secrets
        id: secrets
        env:
          RH_USERNAME: ${{ secrets.RH_USERNAME }}
          RH_PASSWD: ${{ secrets.RH_PASSWD }}
        run: |
          set -euo pipefail
          # Genuinely secret values go to files under RUNNER_TEMP (outside the
          # build context) and are mounted with --secret, so they never land in
          # image history. Never pass these as --build-arg: buildah records
          # build-arg values in the image config, which would publish them in
          # the release tarball. (The device login is intentionally public and
          # is passed as a plain --build-arg.)
          dir="${RUNNER_TEMP}/build-secrets"
          mkdir -p "$dir"; chmod 700 "$dir"
          umask 077
          printf '%s' "$RH_USERNAME"        > "$dir/rh_username"
          printf '%s' "$RH_PASSWD"          > "$dir/rh_password"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Build image (native arm64, registry layer cache)
        id: build
        env:
          CONTAINERFILE: ${{ steps.resolve.outputs.containerfile }}
          IMAGE_REF: ${{ steps.resolve.outputs.image_ref }}
          SECRET_DIR: ${{ steps.secrets.outputs.dir }}
          DEVICE_USERNAME: ${{ vars.DEVICE_USERNAME || 'redhat' }}
          DEVICE_USER_PASSWD: ${{ vars.DEVICE_USER_PASSWD || 'redhat' }}
          # Note: `A && B || C` yields C whenever B is falsy, so test for the
          # false case explicitly rather than passing inputs.squash through.
          SQUASH: ${{ (github.event_name == 'workflow_dispatch' && inputs.squash == false) && 'false' || 'true' }}
        run: |
          set -euo pipefail

          # Registry-backed layer cache. The Actions cache is capped at 10 GB
          # per repo, which a RHEL bootc image with nvidia-jetpack blows past on
          # its own, so the cache lives in ghcr.io instead. Public-repo GHCR
          # storage is free, and the expensive jetpack layers then survive
          # across runs.
          repo_lc="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          cache_repo="ghcr.io/${repo_lc}/buildcache"

          # Probe flag support cheaply and decide up front. Retrying a failed
          # build without the cache flags would mean paying for the whole
          # multi-hour build a second time.
          cache_flags=()
          if podman build --help 2>/dev/null | grep -q -- '--cache-to'; then
            cache_flags=( --cache-from "${cache_repo}" --cache-to "${cache_repo}" )
            if podman build --help 2>/dev/null | grep -q -- '--cache-ttl'; then
              cache_flags+=( --cache-ttl 168h )
            fi
            echo "Layer cache: ${cache_repo}"
          else
            echo "::warning::This podman build does not support --cache-to; building without a remote layer cache."
          fi

          # --squash collapses every layer this Containerfile adds into one.
          # Without it, the entitlement certificates that the final
          # `subscription-manager clean` deletes are only whiteouted: the real
          # files remain readable in an earlier layer of the saved archive,
          # which then ships as a public release asset.
          squash_flag=()
          if [ "${SQUASH}" != "false" ]; then squash_flag=( --squash ); fi

          # Validate the flag combination against a throwaway scratch build, so
          # an incompatibility surfaces in seconds rather than after a
          # multi-hour build. No network or base image needed.
          #
          # This is a HARD failure, not a warning. This repository is public, so
          # a release asset is public, and without --squash the archive carries
          # recoverable Red Hat entitlement certificates. Failing here costs
          # seconds; degrading quietly costs a credential disclosure.
          probe="${RUNNER_TEMP}/flagprobe"
          mkdir -p "$probe"
          echo probe > "$probe/probe.txt"
          printf 'FROM scratch\nCOPY probe.txt /probe.txt\n' > "$probe/Containerfile"
          if ! sudo podman build --layers "${squash_flag[@]}" \
                 -t localhost/flagprobe:tmp \
                 -f "$probe/Containerfile" "$probe" >/dev/null 2>&1; then
            if [ "${SQUASH}" = "false" ]; then
              echo "::error::Probe build failed even with --squash disabled; podman itself is broken on this runner."
            else
              echo "::error::podman rejected '--layers --squash'. Not continuing: without --squash the saved archive retains Red Hat entitlement certificates in a lower layer, and this repository is public."
              echo "::error::Either fix the flag combination, or re-run with squash=false AND publish_release=false to build an image for a private registry only."
            fi
            exit 1
          fi
          sudo podman rmi -f localhost/flagprobe:tmp >/dev/null 2>&1 || true

          args=(
            build
            --platform linux/arm64
            --layers
            "${squash_flag[@]}"
            "${cache_flags[@]}"
            --secret "id=rh_username,src=${SECRET_DIR}/rh_username"
            --secret "id=rh_password,src=${SECRET_DIR}/rh_password"
            # Device login: deliberately public so anyone flashing the image can
            # log in. Build args are fine precisely because they DO end up in the
            # image history — that is the documentation.
            --build-arg "USERNAME=${DEVICE_USERNAME}"
            --build-arg "USER_PASSWD=${DEVICE_USER_PASSWD}"
            -t "${IMAGE_REF}"
            -f "${CONTAINERFILE}"
          )
          args+=( . )

          sudo podman "${args[@]}"

          sudo podman images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | head -20
          df -h /

      - name: Scrub staged secrets
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/build-secrets" || true

      - name: Verify no credentials leaked into the image
        id: verify
        env:
          IMAGE_REF: ${{ steps.resolve.outputs.image_ref }}
          CONTAINERFILE: ${{ steps.resolve.outputs.containerfile }}
          RH_USERNAME: ${{ secrets.RH_USERNAME }}
          RH_PASSWD: ${{ secrets.RH_PASSWD }}
          SQUASH: ${{ (github.event_name == 'workflow_dispatch' && inputs.squash == false) && 'false' || 'true' }}
        run: |
          set -uo pipefail
          fail=0

          meta="$(sudo podman history --no-trunc --format '{{.CreatedBy}}' "$IMAGE_REF"; \
                  sudo podman inspect --format '{{json .Config}}' "$IMAGE_REF")"

          # Only the Red Hat subscription credentials are checked. The device
          # login is intentionally present in the image history.
          for name in RH_USERNAME RH_PASSWD; do
            value="${!name}"
            [ -n "$value" ] || continue
            if printf '%s' "$meta" | grep -qF -- "$value"; then
              echo "::error::The value of secret $name appears in the built image metadata. Do not pass it via --build-arg; use a --mount=type=secret in the Containerfile."
              fail=1
            fi
          done

          # Entitlement certificates must not be visible in the merged filesystem.
          # NOTE: this only proves they are absent from the TOP of the stack. A
          # file deleted in the final layer is still recoverable from the layer
          # below it, which is what the squash assertion below covers.
          #
          # Enumerate per-directory rather than `ls -A dir1 dir2`: with more than
          # one operand ls prints a "dirname:" header for each, so the output is
          # non-empty even when every directory is empty. `subscription-manager
          # clean` empties these directories but leaves them in place, so that
          # form reports a leak on every single build.
          leftovers="$(sudo podman run --rm --entrypoint /bin/sh "$IMAGE_REF" -c '
            for d in /etc/pki/entitlement /etc/pki/consumer ; do
              [ -d "$d" ] || continue
              for f in "$d"/* "$d"/.* ; do
                case "${f##*/}" in .|..) continue ;; esac
                [ -e "$f" ] || continue
                echo "$f"
              done
            done' 2>/dev/null || true)"
          if [ -n "$leftovers" ]; then
            echo "::error::Red Hat entitlement material remains in the image. Ensure the Containerfile ends with: subscription-manager unregister && subscription-manager clean"
            echo "Files found:"
            printf '%s\n' "$leftovers" | sed 's/^/  /'
            fail=1
          else
            echo "No entitlement or consumer certificates present in the image."
          fi

          # Assert that --squash actually took effect, rather than trusting that
          # the flag was accepted. If it did, every layer this Containerfile adds
          # has been collapsed into exactly one, so the pre-`clean` layer that
          # held the entitlement certs no longer exists in the archive.
          #
          # buildah has used both semantics (collapse everything vs collapse only
          # the new layers), so accept either shape.
          base="$(grep -iE '^[[:space:]]*FROM[[:space:]]' "$CONTAINERFILE" | head -1 | awk '{print $2}')"
          n="$(sudo podman image inspect "$IMAGE_REF" --format '{{len .RootFS.Layers}}' 2>/dev/null || echo 0)"
          b="$(sudo podman image inspect "$base" --format '{{len .RootFS.Layers}}' 2>/dev/null || echo 0)"
          echo "Layers: image=${n} base=${b} (base ${base})"

          publishable=false
          if [ "$n" = "1" ] || { [ "$b" != "0" ] && [ "$n" = "$((b + 1))" ]; }; then
            echo "Squash confirmed: this Containerfile contributes a single layer."
            publishable=true
          elif [ "${SQUASH}" = "false" ]; then
            # Deliberately disabled by the operator. Not an error, but the
            # archive is not fit for public release; the publish step enforces it.
            echo "::warning::Built without --squash by request. Entitlement certificates remain recoverable from a lower layer, so this archive will NOT be published as a release. Push it to a private registry instead."
          else
            echo "::error::--squash was requested but did not take effect (image has ${n} layers over a ${b}-layer base)."
            echo "::error::Entitlement certificates deleted by 'subscription-manager clean' are still recoverable from a lower layer, so this archive MUST NOT be published on a public repository."
            fail=1
          fi
          echo "publishable=${publishable}" >> "$GITHUB_OUTPUT"

          [ "$fail" -eq 0 ] && echo "No credential material found in image metadata or entitlement paths."
          exit $fail

      - name: Record installed flightctl-agent version
        id: agentver
        env:
          IMAGE_REF: ${{ steps.resolve.outputs.image_ref }}
          EXPECTED: ${{ steps.resolve.outputs.flightctl_version }}
        run: |
          set -uo pipefail
          actual="$(sudo podman run --rm --entrypoint /bin/sh "$IMAGE_REF" -c \
            'rpm -q --qf "%{VERSION}-%{RELEASE}" flightctl-agent' 2>/dev/null || echo unknown)"
          echo "flightctl-agent in image: ${actual}"
          echo "actual=${actual}" >> "$GITHUB_OUTPUT"
          case "$actual" in
            "${EXPECTED}"*) ;;
            *) echo "::warning::Image name claims Flight Control ${EXPECTED} but the image contains flightctl-agent ${actual}. Pin the version in the Containerfile or rename the Containerfile.";;
          esac
          echo "| flightctl-agent (actual) | \`${actual}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Detect compose provider
        id: compose
        env:
          IMAGE_REF: ${{ steps.resolve.outputs.image_ref }}
        run: |
          set -uo pipefail
          # `podman compose` is a thin wrapper around an external provider and
          # announces which one it delegates to, so one call yields both the
          # provider and its version. The fallbacks cover an image without
          # podman, or one where the provider is only on the CLI-plugin path.
          raw="$(sudo podman run --rm --entrypoint /bin/sh "$IMAGE_REF" -c '
            podman compose version 2>&1 || true
            for c in docker-compose podman-compose ; do
              command -v "$c" >/dev/null 2>&1 && { echo "$c" ; "$c" --version 2>&1 | head -1 ; }
            done
            for p in /usr/libexec/docker/cli-plugins/docker-compose \
                     /usr/lib/docker/cli-plugins/docker-compose ; do
              [ -x "$p" ] && { echo "$p" ; "$p" version 2>&1 | head -1 ; }
            done
          ' 2>/dev/null || true)"

          echo "--- provider probe ---"
          printf '%s\n' "$raw"
          echo "---------------------"

          provider="$(printf '%s\n' "$raw" | sed -n 's/.*compose provider "\([^"]*\)".*/\1/p' | head -1)"
          provider="${provider##*/}"
          [ -n "$provider" ] || provider="$(printf '%s\n' "$raw" | grep -oE '(docker-compose|podman-compose)' | head -1)"
          version="$(printf '%s\n' "$raw" | grep -i version | grep -vi 'compose provider' | grep -oiE 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -1)"

          echo "provider=${provider:-unknown}" >> "$GITHUB_OUTPUT"
          echo "version=${version:-unknown}"   >> "$GITHUB_OUTPUT"
          echo "Compose provider: ${provider:-unknown} ${version:-unknown}"
          echo "| Compose provider | \`${provider:-unknown}\` \`${version:-unknown}\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$provider" ]; then
            echo "::warning::No compose provider found in the image. The Containerfile installs docker-compose-plugin; check that step succeeded."
          fi

      - name: Push image to ghcr.io
        if: inputs.push_to_ghcr
        env:
          IMAGE_REF: ${{ steps.resolve.outputs.image_ref }}
          IMAGE_NAME: ${{ steps.resolve.outputs.image_name }}
          DATE_TAG: ${{ steps.resolve.outputs.date_tag }}
        run: |
          set -euo pipefail
          repo_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          dest="ghcr.io/${repo_lc}/${IMAGE_NAME}"
          sudo podman tag "$IMAGE_REF" "${dest}:${DATE_TAG}"
          sudo podman tag "$IMAGE_REF" "${dest}:latest"
          sudo podman push "${dest}:${DATE_TAG}"
          sudo podman push "${dest}:latest"
          echo "| Registry | \`${dest}:${DATE_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Save image and prepare release assets
        id: package
        env:
          IMAGE_REF: ${{ steps.resolve.outputs.image_ref }}
          IMAGE_NAME: ${{ steps.resolve.outputs.image_name }}
          DATE_TAG: ${{ steps.resolve.outputs.date_tag }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/release"
          mkdir -p "$out"
          stem="${IMAGE_NAME}-${DATE_TAG}"

          # Stream straight into zstd: the uncompressed archive would not fit
          # alongside podman's storage on a hosted runner's disk.
          sudo podman save --format docker-archive "$IMAGE_REF" \
            | zstd -T0 -9 -o "${out}/${stem}.tar.zst"

          # Reclaim the container store now that the archive exists.
          sudo podman rmi -f "$IMAGE_REF" || true
          sudo podman system prune -af || true

          size=$(stat -c%s "${out}/${stem}.tar.zst")
          echo "Compressed archive: $(numfmt --to=iec "$size")"

          # GitHub Release assets are capped at 2 GiB each.
          limit=$((1900 * 1024 * 1024))
          if [ "$size" -gt "$limit" ]; then
            echo "Archive exceeds the 2 GiB release-asset limit; splitting into parts."
            split -b 1900M -d -a 2 "${out}/${stem}.tar.zst" "${out}/${stem}.tar.zst.part"
            rm -f "${out}/${stem}.tar.zst"
            echo "split=true" >> "$GITHUB_OUTPUT"
          else
            echo "split=false" >> "$GITHUB_OUTPUT"
          fi

          ( cd "$out" \
              && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' \
                 | sort | xargs -r sha256sum > SHA256SUMS )
          ls -lh "$out"
          echo "dir=$out"   >> "$GITHUB_OUTPUT"
          echo "stem=$stem" >> "$GITHUB_OUTPUT"
          df -h /

      - name: Write release notes
        id: notes
        env:
          IMAGE_REF: ${{ steps.resolve.outputs.image_ref }}
          IMAGE_NAME: ${{ steps.resolve.outputs.image_name }}
          DATE_TAG: ${{ steps.resolve.outputs.date_tag }}
          CONTAINERFILE_LINK: ${{ steps.resolve.outputs.containerfile_link }}
          AGENT_VERSION: ${{ steps.agentver.outputs.actual }}
          COMPOSE_PROVIDER: ${{ steps.compose.outputs.provider }}
          COMPOSE_VERSION: ${{ steps.compose.outputs.version }}
          SPLIT: ${{ steps.package.outputs.split }}
          OUT: ${{ steps.package.outputs.dir }}
          STEM: ${{ steps.package.outputs.stem }}
          DEVICE_USERNAME: ${{ vars.DEVICE_USERNAME || 'redhat' }}
          DEVICE_USER_PASSWD: ${{ vars.DEVICE_USER_PASSWD || 'redhat' }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/NOTES.md"
          {
            echo "NVIDIA Jetson Orin RHEL Image Mode (bootc) image, built natively on arm64."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE_REF}\` |"
            echo "| Containerfile | \`${CONTAINERFILE_LINK}\` |"
            echo "| flightctl-agent | \`${AGENT_VERSION}\` |"
            echo "| Compose provider | \`${COMPOSE_PROVIDER}\` \`${COMPOSE_VERSION}\` |"
            echo "| Built from | \`${GITHUB_SHA}\` |"
            echo
            echo "## What to download"
            echo
            if [ "$SPLIT" = "true" ]; then
              echo "The image is **\`${STEM}.tar.zst.part*\`** (all parts) plus \`SHA256SUMS\`."
            else
              echo "The image is **\`${STEM}.tar.zst\`** plus \`SHA256SUMS\`."
            fi
            echo
            echo "Ignore *Source code (zip)* and *Source code (tar.gz)* — GitHub attaches those"
            echo "to every release automatically and they cannot be removed. They are the"
            echo "repository, not the built image."
            echo
            echo "## Logging in"
            echo
            echo "Once a device is flashed, log in over SSH or the console with:"
            echo
            echo "| Username | Password |"
            echo "|---|---|"
            echo "| \`${DEVICE_USERNAME}\` | \`${DEVICE_USER_PASSWD}\` |"
            echo
            echo "The account is in the \`wheel\` group, so it can \`sudo\`. These"
            echo "credentials are published deliberately for workshop use — change"
            echo "them before deploying a device anywhere that matters."
            echo
            echo "## Load the image"
            echo
            echo '```bash'
            if [ "$SPLIT" = "true" ]; then
              echo "# Download every ${STEM}.tar.zst.part* file into one directory, then:"
              echo "cat ${STEM}.tar.zst.part* > ${STEM}.tar.zst"
            fi
            echo "sha256sum -c SHA256SUMS"
            echo "zstd -d ${STEM}.tar.zst -o ${STEM}.tar"
            echo "sudo podman load -i ${STEM}.tar"
            echo '```'
            echo
            echo "Loads as \`${IMAGE_REF}\`. Retag and push it to your local registry before building the ISO:"
            echo
            echo '```bash'
            echo "sudo podman tag ${IMAGE_REF} \$HOSTIP:5000/${IMAGE_NAME}:${DATE_TAG}"
            echo "sudo podman push \$HOSTIP:5000/${IMAGE_NAME}:${DATE_TAG}"
            echo '```'
            echo
            echo "Then follow \`managed-device-artifacts/jetson-bootc-build-commands\` from the \`bootc-image-builder\` step onward."
            echo
            echo "> The image contains no Red Hat subscription credentials: it is registered with"
            echo "> \`--mount=type=secret\` at build time and unregistered before the final layer."
            echo "> The device login above **is** baked in, by design."
          } > "$notes"
          echo "path=$notes" >> "$GITHUB_OUTPUT"
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE_TAG: ${{ steps.resolve.outputs.date_tag }}
          IMAGE_NAME: ${{ steps.resolve.outputs.image_name }}
          OUT: ${{ steps.package.outputs.dir }}
          NOTES: ${{ steps.notes.outputs.path }}
          PUBLISHABLE: ${{ steps.verify.outputs.publishable }}
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail

          # A release on a public repository is public: there is no private
          # release asset. Refuse to create one unless the squash assertion
          # confirmed the archive carries no recoverable entitlement certs.
          if [ "${PUBLISHABLE}" != "true" ] && [ "${REPO_VISIBILITY}" != "private" ]; then
            echo "::error::Refusing to publish a release from a ${REPO_VISIBILITY} repository: the squash guarantee did not hold, so the archive may contain recoverable Red Hat entitlement certificates."
            echo "::error::Push the image to a private registry instead (push_to_ghcr, with the package set to private), or re-run once --squash works."
            exit 1
          fi

          if gh release view "$DATE_TAG" >/dev/null 2>&1; then
            echo "Release $DATE_TAG exists; updating notes and replacing assets."
            gh release edit "$DATE_TAG" --notes-file "$NOTES" --title "${IMAGE_NAME} ${DATE_TAG}"
          else
            gh release create "$DATE_TAG" \
              --title "${IMAGE_NAME} ${DATE_TAG}" \
              --notes-file "$NOTES" \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$DATE_TAG" "$OUT"/* --clobber
          gh release view "$DATE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
