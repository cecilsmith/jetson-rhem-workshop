name: Build Jetson bootc image

# Builds the Jetson Orin RHEL Image Mode (bootc) container image natively on
# ARM64, saves it with `podman save`, and publishes it as a GitHub Release
# whose tag is the build date.
#
# Which Containerfile gets built: the ContainerFile-* symlink at the repo root
# (currently ./ContainerFile-Jetson-1.3.0-docker-compose -> managed-device-artifacts/...).
# Repoint that symlink to switch what CI builds.
#
# Required repository secrets are documented in .github/SECRETS.md

on:
  workflow_dispatch:
    inputs:
      containerfile:
        description: "Containerfile path (blank = follow the ContainerFile-* symlink at the repo root)"
        required: false
        default: ""
      image_name:
        description: "Override the derived image name, e.g. jetson-flightctl-1.3.0-docker-compose"
        required: false
        default: ""
      publish_release:
        description: "Publish a GitHub Release with the saved image tarball"
        type: boolean
        default: true
      push_to_ghcr:
        description: "Also push the image to ghcr.io (recommended: a release asset must be split at 2 GB)"
        type: boolean
        default: false
      squash:
        description: "Squash all new layers into one (keeps deleted entitlement certs out of the published tarball)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "ContainerFile-*"
      - "managed-device-artifacts/ContainerFile-*"
      - ".github/workflows/build-jetson-image.yml"

permissions:
  contents: write   # create the release
  packages: write   # push the build cache (and optionally the image) to ghcr.io

concurrency:
  group: build-jetson-image
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Confirm every secret the build needs is actually configured, before we burn
  # an hour of ARM runner time discovering it the hard way.
  # ---------------------------------------------------------------------------
  preflight:
    name: Check required repository secrets
    runs-on: ubuntu-latest
    steps:
      - name: Verify secrets are present
        env:
          REDHAT_REGISTRY_USERNAME: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          REDHAT_REGISTRY_PASSWORD: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}
          RH_USERNAME: ${{ secrets.RH_USERNAME }}
          RH_PASSWD: ${{ secrets.RH_PASSWD }}
          DEVICE_USERNAME: ${{ secrets.DEVICE_USERNAME }}
          DEVICE_USER_PASSWD: ${{ secrets.DEVICE_USER_PASSWD }}
          OCP_PULL_SECRET: ${{ secrets.OCP_PULL_SECRET }}
        run: |
          set -uo pipefail
          missing=()
          for name in REDHAT_REGISTRY_USERNAME REDHAT_REGISTRY_PASSWORD \
                      RH_USERNAME RH_PASSWD DEVICE_USERNAME DEVICE_USER_PASSWD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done

          {
            echo "### Required secrets"
            echo
            for name in REDHAT_REGISTRY_USERNAME REDHAT_REGISTRY_PASSWORD \
                        RH_USERNAME RH_PASSWD DEVICE_USERNAME DEVICE_USER_PASSWD; do
              if [ -n "${!name:-}" ]; then echo "- \`$name\` — set"; else echo "- \`$name\` — **MISSING**"; fi
            done
            echo
            echo "### Optional secrets"
            if [ -n "${OCP_PULL_SECRET:-}" ]; then
              echo "- \`OCP_PULL_SECRET\` — set (needed only by the MicroShift Containerfiles)"
            else
              echo "- \`OCP_PULL_SECRET\` — not set (fine unless you build a MicroShift Containerfile)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. See .github/SECRETS.md"
            exit 1
          fi
          echo "All required secrets are configured."

  build:
    name: Build on native ARM64
    needs: preflight
    # Native aarch64 hosted runner. Free for public repositories.
    # QEMU emulation is NOT used: nvidia-jetpack-* and subscription-manager
    # under binfmt emulation is both unreliable and ~10x slower.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      image_name: ${{ steps.resolve.outputs.image_name }}
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      date_tag: ${{ steps.resolve.outputs.date_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk space
        run: |
          set -uo pipefail
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift 2>/dev/null || true
          sudo apt-get clean || true
          echo "After:"; df -h /

      - name: Install podman and tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman zstd jq
          podman version
          # Rootful podman: the bootc base image layers are large and root
          # storage avoids fuse-overlayfs overhead on the hosted runner.
          sudo podman info --format '{{.Store.GraphDriverName}}'

      - name: Resolve Containerfile and derive image name
        id: resolve
        env:
          INPUT_CONTAINERFILE: ${{ inputs.containerfile }}
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_CONTAINERFILE}" ]; then
            link="${INPUT_CONTAINERFILE}"
          else
            # Follow the ContainerFile-* symlink at the repo root.
            mapfile -t links < <(find . -maxdepth 1 -type l -iname 'Containerfile-*' -printf '%P\n' | sort)
            if [ "${#links[@]}" -eq 0 ]; then
              echo "::error::No ContainerFile-* symlink found at the repo root. Create one (e.g. ln -s ./managed-device-artifacts/ContainerFile-Jetson-1.3.0-docker-compose ContainerFile-Jetson-1.3.0-docker-compose) or pass the containerfile input."
              exit 1
            fi
            if [ "${#links[@]}" -gt 1 ]; then
              echo "::error::Multiple ContainerFile-* symlinks at the repo root (${links[*]}). Keep exactly one, or pass the containerfile input."
              exit 1
            fi
            link="${links[0]}"
          fi

          target="$(readlink -f "$link")"
          [ -f "$target" ] || { echo "::error::$link does not resolve to a file"; exit 1; }

          # ContainerFile-Jetson-1.3.0-docker-compose
          #   -> platform "jetson", version "1.3.0", variant "docker-compose"
          #   -> jetson-flightctl-1.3.0-docker-compose
          base="$(basename "$link")"
          rest="$(echo "${base}" | sed -E 's/^[Cc]ontainer[Ff]ile-//' | tr '[:upper:]' '[:lower:]')"
          platform="${rest%%-*}"
          remainder="${rest#*-}"
          flightctl_version="${remainder%%-*}"

          if [ -n "${INPUT_IMAGE_NAME}" ]; then
            image_name="${INPUT_IMAGE_NAME}"
          else
            image_name="${platform}-flightctl-${remainder}"
          fi

          date_tag="$(date -u +%Y-%m-%d)"
          image_ref="localhost/${image_name}:${date_tag}"

          {
            echo "containerfile=${target}"
            echo "containerfile_link=${link}"
            echo "image_name=${image_name}"
            echo "image_ref=${image_ref}"
            echo "date_tag=${date_tag}"
            echo "flightctl_version=${flightctl_version}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Build target"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Symlink | \`${link}\` |"
            echo "| Containerfile | \`${target#$PWD/}\` |"
            echo "| Image | \`${image_ref}\` |"
            echo "| Flight Control version (from filename) | \`${flightctl_version}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to registry.redhat.io and ghcr.io
        env:
          REDHAT_REGISTRY_USERNAME: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          REDHAT_REGISTRY_PASSWORD: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REDHAT_REGISTRY_PASSWORD" \
            | sudo podman login registry.redhat.io \
                --username "$REDHAT_REGISTRY_USERNAME" --password-stdin
          printf '%s' "$GHCR_TOKEN" \
            | sudo podman login ghcr.io \
                --username "${{ github.actor }}" --password-stdin

      - name: Stage build secrets
        id: secrets
        env:
          RH_USERNAME: ${{ secrets.RH_USERNAME }}
          RH_PASSWD: ${{ secrets.RH_PASSWD }}
          DEVICE_USER_PASSWD: ${{ secrets.DEVICE_USER_PASSWD }}
          OCP_PULL_SECRET: ${{ secrets.OCP_PULL_SECRET }}
        run: |
          set -euo pipefail
          # Secrets go to files under RUNNER_TEMP (outside the build context) and
          # are mounted with --secret, so their values never land in image
          # history. Never pass these as --build-arg: buildah records build-arg
          # values in the image config, which would publish them in the release
          # tarball.
          dir="${RUNNER_TEMP}/build-secrets"
          mkdir -p "$dir"; chmod 700 "$dir"
          umask 077
          printf '%s' "$RH_USERNAME"        > "$dir/rh_username"
          printf '%s' "$RH_PASSWD"          > "$dir/rh_password"
          printf '%s' "$DEVICE_USER_PASSWD" > "$dir/user_passwd"
          if [ -n "${OCP_PULL_SECRET:-}" ]; then
            printf '%s' "$OCP_PULL_SECRET"  > "$dir/pullsecret"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Build image (native arm64, registry layer cache)
        id: build
        env:
          CONTAINERFILE: ${{ steps.resolve.outputs.containerfile }}
          IMAGE_REF: ${{ steps.resolve.outputs.image_ref }}
          SECRET_DIR: ${{ steps.secrets.outputs.dir }}
          DEVICE_USERNAME: ${{ secrets.DEVICE_USERNAME }}
          # Note: `A && B || C` yields C whenever B is falsy, so test for the
          # false case explicitly rather than passing inputs.squash through.
          SQUASH: ${{ (github.event_name == 'workflow_dispatch' && inputs.squash == false) && 'false' || 'true' }}
        run: |
          set -euo pipefail

          # Registry-backed layer cache. The Actions cache is capped at 10 GB
          # per repo, which a RHEL bootc image with nvidia-jetpack blows past on
          # its own, so the cache lives in ghcr.io instead. Public-repo GHCR
          # storage is free, and the expensive layers (jetpack, MicroShift) then
          # survive across runs.
          repo_lc="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          cache_repo="ghcr.io/${repo_lc}/buildcache"

          # Probe flag support cheaply and decide up front. Retrying a failed
          # build without the cache flags would mean paying for the whole
          # multi-hour build a second time.
          cache_flags=()
          if podman build --help 2>/dev/null | grep -q -- '--cache-to'; then
            cache_flags=( --cache-from "${cache_repo}" --cache-to "${cache_repo}" )
            if podman build --help 2>/dev/null | grep -q -- '--cache-ttl'; then
              cache_flags+=( --cache-ttl 168h )
            fi
            echo "Layer cache: ${cache_repo}"
          else
            echo "::warning::This podman build does not support --cache-to; building without a remote layer cache."
          fi

          # --squash collapses every layer this Containerfile adds into one.
          # Without it, the entitlement certificates that the final
          # `subscription-manager clean` deletes are only whiteouted: the real
          # files remain readable in an earlier layer of the saved archive,
          # which then ships as a public release asset.
          squash_flag=()
          if [ "${SQUASH}" != "false" ]; then squash_flag=( --squash ); fi

          args=(
            build
            --platform linux/arm64
            --layers
            "${squash_flag[@]}"
            "${cache_flags[@]}"
            --secret "id=rh_username,src=${SECRET_DIR}/rh_username"
            --secret "id=rh_password,src=${SECRET_DIR}/rh_password"
            --secret "id=user_passwd,src=${SECRET_DIR}/user_passwd"
            --build-arg "USERNAME=${DEVICE_USERNAME}"
            -t "${IMAGE_REF}"
            -f "${CONTAINERFILE}"
          )
          if [ -f "${SECRET_DIR}/pullsecret" ]; then
            args+=( --secret "id=pullsecret,src=${SECRET_DIR}/pullsecret"
                    --authfile "${SECRET_DIR}/pullsecret" )
          fi
          args+=( . )

          sudo podman "${args[@]}"

          sudo podman images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | head -20
          df -h /

      - name: Scrub staged secrets
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/build-secrets" || true

      - name: Verify no credentials leaked into the image
        env:
          IMAGE_REF: ${{ steps.resolve.outputs.image_ref }}
          RH_USERNAME: ${{ secrets.RH_USERNAME }}
          RH_PASSWD: ${{ secrets.RH_PASSWD }}
          DEVICE_USER_PASSWD: ${{ secrets.DEVICE_USER_PASSWD }}
        run: |
          set -uo pipefail
          fail=0

          meta="$(sudo podman history --no-trunc --format '{{.CreatedBy}}' "$IMAGE_REF"; \
                  sudo podman inspect --format '{{json .Config}}' "$IMAGE_REF")"

          for name in RH_USERNAME RH_PASSWD DEVICE_USER_PASSWD; do
            value="${!name}"
            [ -n "$value" ] || continue
            if printf '%s' "$meta" | grep -qF -- "$value"; then
              echo "::error::The value of secret $name appears in the built image metadata. Do not pass it via --build-arg; use a --mount=type=secret in the Containerfile."
              fail=1
            fi
          done

          # Entitlement certificates must not ship inside the image.
          leftovers="$(sudo podman run --rm --entrypoint /bin/sh "$IMAGE_REF" -c \
            'ls -A /etc/pki/entitlement /etc/pki/consumer 2>/dev/null' || true)"
          if [ -n "$leftovers" ]; then
            echo "::error::Red Hat entitlement certificates remain in the image. Ensure the Containerfile ends with: subscription-manager unregister && subscription-manager clean"
            fail=1
          fi

          [ "$fail" -eq 0 ] && echo "No credential material found in image metadata or entitlement paths."
          exit $fail

      - name: Record installed flightctl-agent version
        id: agentver
        env:
          IMAGE_REF: ${{ steps.resolve.outputs.image_ref }}
          EXPECTED: ${{ steps.resolve.outputs.flightctl_version }}
        run: |
          set -uo pipefail
          actual="$(sudo podman run --rm --entrypoint /bin/sh "$IMAGE_REF" -c \
            'rpm -q --qf "%{VERSION}-%{RELEASE}" flightctl-agent' 2>/dev/null || echo unknown)"
          echo "flightctl-agent in image: ${actual}"
          echo "actual=${actual}" >> "$GITHUB_OUTPUT"
          case "$actual" in
            "${EXPECTED}"*) ;;
            *) echo "::warning::Image name claims Flight Control ${EXPECTED} but the image contains flightctl-agent ${actual}. Pin the version in the Containerfile or rename the Containerfile.";;
          esac
          echo "| flightctl-agent (actual) | \`${actual}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Push image to ghcr.io
        if: inputs.push_to_ghcr
        env:
          IMAGE_REF: ${{ steps.resolve.outputs.image_ref }}
          IMAGE_NAME: ${{ steps.resolve.outputs.image_name }}
          DATE_TAG: ${{ steps.resolve.outputs.date_tag }}
        run: |
          set -euo pipefail
          repo_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          dest="ghcr.io/${repo_lc}/${IMAGE_NAME}"
          sudo podman tag "$IMAGE_REF" "${dest}:${DATE_TAG}"
          sudo podman tag "$IMAGE_REF" "${dest}:latest"
          sudo podman push "${dest}:${DATE_TAG}"
          sudo podman push "${dest}:latest"
          echo "| Registry | \`${dest}:${DATE_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Save image and prepare release assets
        id: package
        env:
          IMAGE_REF: ${{ steps.resolve.outputs.image_ref }}
          IMAGE_NAME: ${{ steps.resolve.outputs.image_name }}
          DATE_TAG: ${{ steps.resolve.outputs.date_tag }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/release"
          mkdir -p "$out"
          stem="${IMAGE_NAME}-${DATE_TAG}"

          # Stream straight into zstd: the uncompressed archive would not fit
          # alongside podman's storage on a hosted runner's disk.
          sudo podman save --format docker-archive "$IMAGE_REF" \
            | zstd -T0 -9 -o "${out}/${stem}.tar.zst"

          # Reclaim the container store now that the archive exists.
          sudo podman rmi -f "$IMAGE_REF" || true
          sudo podman system prune -af || true

          size=$(stat -c%s "${out}/${stem}.tar.zst")
          echo "Compressed archive: $(numfmt --to=iec "$size")"

          # GitHub Release assets are capped at 2 GiB each.
          limit=$((1900 * 1024 * 1024))
          if [ "$size" -gt "$limit" ]; then
            echo "Archive exceeds the 2 GiB release-asset limit; splitting into parts."
            split -b 1900M -d -a 2 "${out}/${stem}.tar.zst" "${out}/${stem}.tar.zst.part"
            rm -f "${out}/${stem}.tar.zst"
            echo "split=true" >> "$GITHUB_OUTPUT"
          else
            echo "split=false" >> "$GITHUB_OUTPUT"
          fi

          ( cd "$out" \
              && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' \
                 | sort | xargs -r sha256sum > SHA256SUMS )
          ls -lh "$out"
          echo "dir=$out"   >> "$GITHUB_OUTPUT"
          echo "stem=$stem" >> "$GITHUB_OUTPUT"
          df -h /

      - name: Write release notes
        id: notes
        env:
          IMAGE_REF: ${{ steps.resolve.outputs.image_ref }}
          IMAGE_NAME: ${{ steps.resolve.outputs.image_name }}
          DATE_TAG: ${{ steps.resolve.outputs.date_tag }}
          CONTAINERFILE_LINK: ${{ steps.resolve.outputs.containerfile_link }}
          AGENT_VERSION: ${{ steps.agentver.outputs.actual }}
          SPLIT: ${{ steps.package.outputs.split }}
          OUT: ${{ steps.package.outputs.dir }}
          STEM: ${{ steps.package.outputs.stem }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/NOTES.md"
          {
            echo "NVIDIA Jetson Orin RHEL Image Mode (bootc) image, built natively on arm64."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE_REF}\` |"
            echo "| Containerfile | \`${CONTAINERFILE_LINK}\` |"
            echo "| flightctl-agent | \`${AGENT_VERSION}\` |"
            echo "| Built from | \`${GITHUB_SHA}\` |"
            echo
            echo "## Load the image"
            echo
            echo '```bash'
            if [ "$SPLIT" = "true" ]; then
              echo "# Download every ${STEM}.tar.zst.part* file into one directory, then:"
              echo "cat ${STEM}.tar.zst.part* > ${STEM}.tar.zst"
            fi
            echo "sha256sum -c SHA256SUMS"
            echo "zstd -d ${STEM}.tar.zst -o ${STEM}.tar"
            echo "sudo podman load -i ${STEM}.tar"
            echo '```'
            echo
            echo "Loads as \`${IMAGE_REF}\`. Retag and push it to your local registry before building the ISO:"
            echo
            echo '```bash'
            echo "sudo podman tag ${IMAGE_REF} \$HOSTIP:5000/${IMAGE_NAME}:${DATE_TAG}"
            echo "sudo podman push \$HOSTIP:5000/${IMAGE_NAME}:${DATE_TAG}"
            echo '```'
            echo
            echo "Then follow \`managed-device-artifacts/jetson-bootc-build-commands\` from the \`bootc-image-builder\` step onward."
            echo
            echo "> The image contains no Red Hat subscription credentials: it is registered with"
            echo "> \`--mount=type=secret\` at build time and unregistered before the final layer."
            echo "> It **does** contain the device login account baked in at build time."
          } > "$notes"
          echo "path=$notes" >> "$GITHUB_OUTPUT"
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE_TAG: ${{ steps.resolve.outputs.date_tag }}
          IMAGE_NAME: ${{ steps.resolve.outputs.image_name }}
          OUT: ${{ steps.package.outputs.dir }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          if gh release view "$DATE_TAG" >/dev/null 2>&1; then
            echo "Release $DATE_TAG exists; updating notes and replacing assets."
            gh release edit "$DATE_TAG" --notes-file "$NOTES" --title "${IMAGE_NAME} ${DATE_TAG}"
          else
            gh release create "$DATE_TAG" \
              --title "${IMAGE_NAME} ${DATE_TAG}" \
              --notes-file "$NOTES" \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$DATE_TAG" "$OUT"/* --clobber
          gh release view "$DATE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
