name: Secret scan

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly re-scan so newly-published detection rules catch old commits.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a rotated credential still lives in old commits.
          fetch-depth: 0

      # gitleaks compiles rules with RE2, which rejects several common PCRE
      # constructs. A rejected pattern does not surface as a config error — it
      # panics the whole scan with a Go stack trace. Catch it here with a
      # readable message instead.
      - name: Lint .gitleaks.toml for RE2 compatibility
        run: |
          python3 - <<'PYEOF'
          import re, sys, tomllib

          CHECKS = [
              (r'\(\?=',          'lookahead (?=...)'),
              (r'\(\?!',          'negative lookahead (?!...)'),
              (r'\(\?<=',         'lookbehind (?<=...)'),
              (r'\(\?<!',         'negative lookbehind (?<!...)'),
              (r'\(\?>',          'atomic group (?>...)'),
              (r'\(\?\(',         'conditional (?(...))'),
              (r'\\K',            r'\K'),
              (r'(?<!\\)\\[1-9]', 'backreference'),
              (r'[*+?]\+',        'possessive quantifier'),
          ]
          REPEAT, MAX_REPEAT = re.compile(r'\{(\d+)(?:,(\d+))?\}'), 1000

          d = tomllib.load(open('.gitleaks.toml', 'rb'))
          items = [(r['id'], r['regex']) for r in d.get('rules', [])]
          items += [(r['id'] + '.path', r['path']) for r in d.get('rules', []) if 'path' in r]
          for i, a in enumerate(d.get('allowlists', [])):
              for key in ('regexes', 'paths'):
                  items += [(f'allowlist[{i}].{key}[{j}]', p)
                            for j, p in enumerate(a.get(key, []))]

          bad = 0
          for name, pattern in items:
              problems = [label for pat, label in CHECKS if re.search(pat, pattern)]
              for m in REPEAT.finditer(pattern):
                  for g in m.groups():
                      if g is not None and int(g) > MAX_REPEAT:
                          problems.append(f'repetition {m.group(0)} exceeds RE2 max of {MAX_REPEAT}')
              try:
                  re.compile(pattern)
              except re.error as e:
                  problems.append(f'invalid regex: {e}')
              if problems:
                  bad += 1
                  print(f"::error file=.gitleaks.toml::{name}: {'; '.join(problems)}")

          print(f'{len(items)} patterns checked, {bad} incompatible')
          sys.exit(1 if bad else 0)
          PYEOF

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  repo-hygiene:
    name: Repo hygiene (no external deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A deliberately dependency-free backstop, so this check keeps working
      # even if the gitleaks action is unavailable or rate limited.
      - name: Fail on files that must never be tracked
        run: |
          set -uo pipefail
          fail=0
          # Files that carry live enrollment / entitlement material.
          forbidden_globs=(
            'config.yaml'
            '*/config.yaml'
            'pull-secret'
            'pull-secret.json'
            '*.pem'
            '*.key'
            '*.p12'
            'auth.json'
            '.env'
          )
          for glob in "${forbidden_globs[@]}"; do
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              echo "::error file=$f::'$f' is tracked in git but may contain enrollment or credential material. Remove it from the index and add it to .gitignore."
              fail=1
            done < <(git ls-files -- "$glob")
          done
          exit $fail

      - name: Scan tracked files for credential patterns
        run: |
          set -uo pipefail
          fail=0

          report() {
            # $1 = human description, $2 = grep -E pattern, $3.. = paths
            local desc="$1" pattern="$2"; shift 2
            local hits
            hits="$(git ls-files -z -- "$@" \
              | xargs -0 -r grep -nIEH -- "$pattern" 2>/dev/null || true)"
            if [ -n "$hits" ]; then
              # Print file:line only. Never echo the matched value into the log.
              while IFS= read -r hit; do
                local loc="${hit%%:*}"
                local rest="${hit#*:}"
                local line="${rest%%:*}"
                echo "::error file=$loc,line=$line::$desc"
                fail=1
              done <<< "$hits"
            fi
          }

          # USER_PASSWD / USERNAME are deliberately excluded: the managed-device
          # login is published on purpose so people flashing the image can log in.
          report "Containerfile ARG has a hardcoded credential default; pass it as a build secret instead" \
            '^[[:space:]]*ARG[[:space:]]+(RH_PASSWD|RH_PASSWORD|RH_USERNAME|RH_USER|ROOT_PASSWD|REGISTRY_PASSWORD)[[:space:]]*=[[:space:]]*["'"'"']?[^[:space:]"'"'"'#]' \
            'ContainerFile-*' 'Containerfile*' '*/ContainerFile-*' '*/Containerfile*'

          report "subscription-manager called with a literal --password value" \
            'subscription-manager.*--password[= ]+[^$[:space:]]' \
            '*' ':(exclude).gitleaks.toml' ':(exclude).github/workflows/*'

          report "Private key material committed to the repo" \
            '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            '*' ':(exclude).gitleaks.toml' ':(exclude).github/workflows/*'

          report "Container registry pull secret / auth blob committed to the repo" \
            '"auths"[[:space:]]*:[[:space:]]*\{' \
            '*' ':(exclude).gitleaks.toml' ':(exclude).github/workflows/*'

          if [ "$fail" -eq 0 ]; then
            echo "No credential patterns found in tracked files."
          fi
          exit $fail

      - name: Warn on untracked-but-present credential files
        run: |
          set -uo pipefail
          # These are fine to have locally, but flag them so a stray `git add -A`
          # never sweeps them in.
          found="$(git ls-files --others --exclude-standard \
            -- 'config.yaml' '*/config.yaml' 'pull-secret*' '*.pem' '*.key' 'auth.json' || true)"
          if [ -n "$found" ]; then
            echo "::warning::Untracked credential-bearing files present in the working tree (not committed):"
            echo "$found" | sed 's/^/  - /'
            echo "$found" | sed 's/^/  - /' >> "$GITHUB_STEP_SUMMARY"
          fi
